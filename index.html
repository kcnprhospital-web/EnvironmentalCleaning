<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCPH Environmental Cleaning Monitoring</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1E3A9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KCPH Cleaning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#1E3A9E; --blue-2:#2E5BD8; --sky:#2E9BDA; --blue-soft:#e8eefc;
  --gold:#D9A520; --gold-soft:#fff6dc;
  --leaf:#2FA44F; --leaf-soft:#e3f6e8;
  --teal:#13A39A; --purple:#7B4FD0; --purple-soft:#f0eafc;
  --red:#E0322F; --red-soft:#fdebea;
  --green:#1f9a50; --green-soft:#e3f6e9;
  --amber:#D98A0B; --amber-soft:#fff3dd;
  --ink:#16203a; --muted:#56607a; --line:#dde3f0; --card:#ffffff;
  --radius:16px; --shadow:0 4px 18px rgba(30,58,158,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Kantumruy Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;line-height:1.6;
  background:linear-gradient(180deg,#eaf0ff 0%,#f2f8f4 45%,#f6f7fb 100%) fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

/* ---------- Header ---------- */
.topbar{background:linear-gradient(120deg,#16307f 0%,#1E3A9E 35%,#2E6FD8 70%,#18A39A 100%);color:#fff;position:sticky;top:0;z-index:20;
  box-shadow:0 4px 16px rgba(20,40,120,.3);border-bottom:4px solid var(--gold)}
.topbar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar img{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.brand{flex:1;min-width:0}
.brand .h{font-weight:700;font-size:19px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.brand .s{font-size:14px;color:#ffe9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{border:2px solid var(--gold);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700;font-size:15px;flex:none}
.langbtn:hover{background:var(--gold);color:#16203a}
.status{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.15);white-space:nowrap;flex:none;font-weight:600}
.status.ok{background:var(--leaf)}.status.demo{background:var(--amber)}
nav.tabs{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:82px;z-index:19}
nav.tabs .in{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:#f0f3fa;padding:9px 16px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap;border-radius:999px;font-size:15.5px}
nav.tabs button.on{color:#fff;background:linear-gradient(120deg,var(--blue),var(--blue-2));box-shadow:0 3px 10px rgba(30,58,158,.3)}

main{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);border-top:5px solid var(--accent,var(--blue))}
.card h2{font-size:20px;margin:0 0 4px;color:var(--accent-ink,var(--blue))}
.card h3{font-size:18px;margin:0 0 10px;color:var(--accent-ink,var(--blue))}
#tab-audit .card:nth-of-type(1){--accent:var(--gold);--accent-ink:#8a6400}
#tab-audit .card:nth-of-type(2){--accent:var(--sky);--accent-ink:var(--blue)}
#tab-audit .card:nth-of-type(3){--accent:var(--leaf);--accent-ink:#17703a}
#tab-tools .card:nth-of-type(1){--accent:var(--teal);--accent-ink:#0b6e68}
#tab-tools .card:nth-of-type(2){--accent:var(--purple);--accent-ink:#5a33a8}
#tab-tools .card:nth-of-type(3){--accent:var(--gold);--accent-ink:#8a6400}
#tab-report .card,#tab-records .card,#tab-dash .card{--accent:var(--blue-2)}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
label.f{display:block;font-size:15px;font-weight:700;color:#34405e;margin-bottom:5px}
label.f .req{color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],input[type=password],select,textarea{
  width:100%;border:1.5px solid #cfd7ea;border-radius:12px;padding:11px 13px;background:#fbfcff;outline:none;font-size:16px;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--blue-2);background:#fff;box-shadow:0 0 0 4px rgba(46,91,216,.15)}
textarea{min-height:84px;resize:vertical}

/* module selector */
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mod{--m:var(--blue);--ms:var(--blue-soft);border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;transition:.15s;position:relative}
.mod[data-mod-btn="SURF"]{--m:var(--leaf);--ms:var(--leaf-soft)}
.mod[data-mod-btn="OBS"]{--m:var(--blue-2);--ms:var(--blue-soft)}
.mod[data-mod-btn="SUP"]{--m:var(--gold);--ms:var(--gold-soft)}
.mod .t{font-weight:700;color:var(--ink);display:block;line-height:1.35;font-size:17px}
.mod .d{font-size:14px;color:var(--muted);display:block;margin-top:4px;line-height:1.4}
.mod .ic{font-size:24px;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--ms);margin-bottom:8px;flex:none}
.mod:hover{border-color:var(--m)}
.mod.on{border-color:var(--m);background:var(--ms);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mod.on .ic{background:var(--m);color:#fff}
.mod.on::after{content:'✓';position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--m);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}

/* area picker */
.pick{border:2px dashed #b9c6ea;border-radius:var(--radius);padding:18px;text-align:center;background:linear-gradient(135deg,#f3f7ff,#f2fbf5)}
.pick p{margin:0 0 12px;font-weight:700;color:var(--blue);font-size:16.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:2px solid var(--blue-2);background:#fff;color:var(--blue);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15.5px;min-height:46px}
.chip:nth-child(3n+2){border-color:var(--leaf);color:#17703a}
.chip:nth-child(3n){border-color:var(--gold);color:#8a6400}
.chip:hover{background:var(--blue-2);border-color:var(--blue-2);color:#fff}

/* items */
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px;background:#fff;transition:.15s}
.item.done{border-color:#c7e8d2;background:#fbfffc}
.item.miss{border-color:var(--red);background:var(--red-soft)}
.item .lb{flex:1;min-width:0;font-size:16.5px;line-height:1.5}
.item .no{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;margin-right:6px;vertical-align:1px}
.item.done .no{background:var(--leaf);color:#fff}
.item .tag{font-size:12px;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap;font-weight:700}
.tag.H{background:var(--red-soft);color:#b0201d}.tag.L{background:#eef0f4;color:var(--muted)}.tag.T{background:var(--gold-soft);color:#8a6400}
.opts{display:flex;gap:8px;flex:none}
.opt{border:2px solid #d3daea;background:#fff;border-radius:12px;min-width:64px;min-height:54px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:18px;line-height:1.15;transition:.12s}
.opt small{display:block;font-weight:600;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt.C,.opt.Y{color:var(--green)}.opt.P{color:var(--amber)}.opt.N{color:var(--red)}.opt.NA{color:#6b7280}
.opt:hover{border-color:currentColor}
.opt.on.C,.opt.on.Y{background:var(--green);border-color:var(--green);color:#fff}
.opt.on.P{background:var(--amber);border-color:var(--amber);color:#fff}
.opt.on.N{background:var(--red);border-color:var(--red);color:#fff}
.opt.on.NA{background:#6b7280;border-color:#6b7280;color:#fff}
.opt.on small{color:rgba(255,255,255,.95)}
.sec-h{font-weight:700;color:#8a6400;margin:14px 0 2px;font-size:16.5px;background:var(--gold-soft);padding:8px 12px;border-radius:10px}

.scorebar{position:sticky;bottom:0;background:linear-gradient(120deg,#16307f,#1E3A9E 50%,#2E6FD8);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;margin:16px -18px -18px;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 -4px 14px rgba(20,40,120,.2)}
.scorebar .big{font-size:30px;font-weight:700;background:#fff;border-radius:12px;padding:2px 14px;min-width:110px;text-align:center}
.scorebar .big{color:var(--ink)}.scorebar .big.good{color:var(--green)}.scorebar .big.fair{color:var(--amber)}.scorebar .big.poor{color:var(--red)}
.scorebar .btn{white-space:nowrap;padding:12px 16px}
.scorebar .meta{font-size:14px;color:#dfe7ff;flex:1}
.btn{border:0;border-radius:12px;padding:12px 20px;cursor:pointer;font-weight:700;background:linear-gradient(120deg,var(--blue),var(--blue-2));color:#fff;font-size:16px;min-height:48px;box-shadow:0 3px 10px rgba(30,58,158,.25)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--blue-2);box-shadow:none}
.btn.red{background:linear-gradient(120deg,#c8211f,var(--red))}
.btn.gold{background:linear-gradient(120deg,#c58f10,var(--gold));color:#16203a}
.btn.leaf{background:linear-gradient(120deg,#1f8a3f,var(--leaf))}
.scorebar .btn{background:var(--gold);color:#16203a;box-shadow:none}
.scorebar .btn.sec{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7)}
.btn.sm{padding:8px 14px;font-size:14.5px;min-height:40px}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1;min-width:160px}
.row > .btn{flex:none}

.good{color:var(--green)}.fair{color:var(--amber)}.poor{color:var(--red)}
.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-size:13.5px;font-weight:700}
.pill.good{background:var(--green-soft)}.pill.fair{background:var(--amber-soft)}.pill.poor{background:var(--red-soft)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{--k:var(--leaf);--ks:var(--leaf-soft);background:linear-gradient(140deg,var(--ks) 0%,#fff 70%);border:1px solid var(--line);border-left:6px solid var(--k);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative}
.kpi:nth-child(2){--k:var(--blue-2);--ks:var(--blue-soft)}
.kpi:nth-child(3){--k:var(--gold);--ks:var(--gold-soft)}
.kpi:nth-child(4){--k:var(--purple);--ks:var(--purple-soft)}
.kpi::after{position:absolute;top:12px;right:14px;font-size:26px;opacity:.9}
.kpi:nth-child(1)::after{content:'🧽'}.kpi:nth-child(2)::after{content:'👀'}.kpi:nth-child(3)::after{content:'🧴'}.kpi:nth-child(4)::after{content:'💬'}
.kpi .l{font-size:15px;color:#34405e;font-weight:700;line-height:1.3;padding-right:34px}
.kpi .v{font-size:36px;font-weight:700;line-height:1.2;margin-top:6px}
.kpi .n{font-size:13.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:linear-gradient(180deg,#eef2fd,#e6ecfb);color:#2a3a6e;font-weight:700;font-size:14px}
tbody tr:nth-child(even) td{background:#fafbff}
td.num,th.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.bar{height:12px;background:#e9edf6;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.good{background:linear-gradient(90deg,#3cc46d,var(--green))}.bar i.fair{background:linear-gradient(90deg,#f5b53f,var(--amber))}.bar i.poor{background:linear-gradient(90deg,#f26a5f,var(--red))}
tr.click{cursor:pointer}tr.click:hover td{background:#eef3ff}
.empty{color:var(--muted);text-align:center;padding:26px;font-size:15.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;z-index:99;font-size:16px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;max-width:calc(100% - 32px)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);max-width:760px;width:100%;padding:20px;border-top:6px solid var(--blue-2)}
.queue{background:var(--gold-soft);border:1.5px solid #f0d49b;color:#7a5410;border-radius:14px;padding:11px 14px;margin-bottom:14px;display:none;align-items:center;gap:10px;font-weight:600}
.queue span{flex:1}
.ref li{margin-bottom:6px}
.calc-out{background:linear-gradient(120deg,#e3f7f5,#e8eefc);border-left:5px solid var(--teal);border-radius:12px;padding:14px;margin-top:12px;font-weight:600;font-size:16px}

/* ---------- Report (screen + print) ---------- */
#reportDoc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;color:#000;box-shadow:var(--shadow)}
.rp-head{text-align:center;margin-bottom:14px}
.rp-head img{width:84px;height:84px}
.rp-head .hn{font-weight:700;font-size:16px;margin-top:4px;color:var(--blue)}
.rp-head .he{font-size:13px;color:#333}
.rp-title{text-align:center;font-weight:700;font-size:17px;margin:14px 0 2px}
.rp-title2{text-align:center;font-size:14px;margin-bottom:4px}
.rp-meta{text-align:center;font-size:13px;color:#333;margin-bottom:16px}
#reportDoc h4{font-size:14.5px;margin:18px 0 6px;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:3px}
#reportDoc table{font-size:12.5px}
#reportDoc th,#reportDoc td{border:1px solid #bfc5d6;padding:5px 6px;background:none}
#reportDoc th{background:#e9ecf8;color:#1c2233}
#reportDoc ul{margin:4px 0;padding-left:20px;font-size:13px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;text-align:center;font-size:13px}
.sig .ln{margin-top:62px;border-top:1px dotted #555;padding-top:4px}
.rp-foot{margin-top:22px;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:6px}

/* ---------- Phones ---------- */
@media (max-width:640px){
  body{font-size:17px}
  .topbar-in{padding:9px 12px;gap:10px}
  .topbar img{width:52px;height:52px}
  .brand .h{font-size:17px}
  .brand .s{font-size:13.5px}
  nav.tabs{top:74px}
  nav.tabs button{font-size:15.5px;padding:9px 15px}
  .status{font-size:0;width:14px;height:14px;padding:0;border:2px solid rgba(255,255,255,.8)}
  main{padding:14px 12px 90px}
  .card{padding:16px 14px}
  .card h2{font-size:20px}.card h3{font-size:18.5px}
  .hint{font-size:15px}
  label.f{font-size:16px}
  input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],input[type=password],select,textarea{font-size:17px;min-height:52px}
  .grid{grid-template-columns:1fr}
  .mods{grid-template-columns:1fr}
  .mod{display:flex;gap:12px;align-items:center;padding:12px 14px}
  .mod .ic{margin:0}
  .mod .t{font-size:17.5px}.mod .d{font-size:14.5px}
  .item{flex-direction:column;align-items:stretch;gap:10px;padding:13px}
  .item .lb{font-size:17.5px}
  .opts{display:grid;grid-template-columns:repeat(var(--n),1fr)}
  .opt{min-height:60px;font-size:20px}
  .opt small{font-size:13.5px}
  .chip{font-size:16px;flex:1 1 100%}
  .scorebar{flex-wrap:wrap;gap:10px 12px;margin:16px -14px -16px;padding:12px 14px}
  .scorebar .big{font-size:28px}
  .scorebar .meta{flex:1 1 50%;font-size:14.5px}
  .scorebar .btn{flex:1}
  .btn{font-size:17px;min-height:52px}
  .row > *{min-width:100%}
  .row > .btn{flex:1 1 100%}
  table{font-size:15px}
  .kpi .v{font-size:34px}
}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .topbar,nav.tabs,.no-print,.toast,.modal-bg,.queue{display:none !important}
  main{padding:0;max-width:none}
  .tab{display:none !important}
  #tab-report{display:block !important}
  #reportDoc{border:0;padding:0;border-radius:0;box-shadow:none}
  #reportDoc h4{break-after:avoid}
  #reportDoc tr{break-inside:avoid}
  .sig{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<main>
  <div class="queue" id="queueBox"><span id="queueTxt"></span><button class="btn sm" id="syncBtn" type="button" data-i="syncNow"></button></div>

  <!-- ================= AUDIT ================= -->
  <section class="tab on" id="tab-audit">
    <div class="card">
      <h2 data-i="chooseTool"></h2>
      <p class="hint" data-i="chooseToolHint"></p>
      <div class="mods" id="mods"></div>
    </div>

    <div class="card">
      <h3 data-i="auditDetails"></h3>
      <div class="grid">
        <div><label class="f"><span data-i="date"></span> <span class="req">*</span></label><input type="date" id="f_date"></div>
        <div><label class="f"><span data-i="time"></span></label><input type="time" id="f_time"></div>
        <div><label class="f"><span data-i="ward"></span> <span class="req">*</span></label><select id="f_ward"></select></div>
        <div data-mod="SURF OBS"><label class="f"><span data-i="area"></span> <span class="req">*</span></label><select id="f_area"></select></div>
        <div data-mod="SURF OBS"><label class="f"><span data-i="cleanType"></span> <span class="req">*</span></label><select id="f_clean"></select></div>
        <div data-mod="SURF"><label class="f"><span data-i="method"></span> <span class="req">*</span></label><select id="f_method"></select></div>
        <div data-mod="SURF OBS"><label class="f" data-i="location"></label><input type="text" id="f_loc" maxlength="60" data-ip="locationPh"></div>
        <div data-mod="SURF OBS"><label class="f" data-i="cleaner"></label><input type="text" id="f_cleaner" maxlength="60" data-ip="cleanerPh"></div>
        <div><label class="f"><span data-i="auditor"></span> <span class="req">*</span></label><input type="text" id="f_auditor" maxlength="60" data-ip="auditorPh"></div>
      </div>
    </div>

    <div class="card">
      <h3 id="itemsTitle"></h3>
      <p class="hint" id="itemsHint"></p>
      <div class="items" id="items"></div>

      <div style="margin-top:16px" class="grid">
        <div><label class="f" data-i="feedbackGiven"></label>
          <select id="f_feedback"><option value=""></option><option value="Y"></option><option value="N"></option></select></div>
      </div>
      <div style="margin-top:12px"><label class="f" data-i="action"></label><textarea id="f_action" maxlength="500" data-ip="actionPh"></textarea></div>
      <div style="margin-top:12px"><label class="f" data-i="comments"></label><textarea id="f_comments" maxlength="500"></textarea></div>

      <div class="scorebar">
        <div class="big" id="liveScore">–</div>
        <div class="meta" id="liveMeta"></div>
        <button class="btn sec" id="resetBtn" type="button" data-i="reset"></button>
        <button class="btn" id="submitBtn" type="button" data-i="submit"></button>
      </div>
    </div>

  <!-- ================= DASHBOARD ================= -->
  <section class="tab" id="tab-dash">

  <!-- ================= TOOLS ================= -->

        <div><label class="f" data-i="totalLitres"></label><input type="number" id="c_vl" value="10" step="0.5" min="0.1"></div>
      </div>
      <div class="calc-out" id="c_out1"></div>
      <h3 style="margin-top:18px" data-i="powderBleach"></h3>

        <div><label class="f" data-i="powderPct"></label><input type="number" id="c_pp" value="35" step="1" min="1"></div>
        <div><label class="f" data-i="desiredPct"></label><select id="c_dp2"><option value="0.5">0.5% (5000 ppm)</option><option value="0.1">0.1% (1000 ppm)</option><option value="0.05">0.05% (500 ppm)</option></select></div>
        <div><label class="f" data-i="totalLitres"></label><input type="number" id="c_vl2" value="10" step="0.5" min="0.1"></div>

        <div><label class="f" data-i="fairThr"></label><input type="number" id="s_fair" min="1" max="100"></div>

    </div>

function toast(msg, type){
  const el = $('toast'); el.textContent = msg; el.className = 'toast ' + (type || '');
  el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 3200);
}

/* ---------- API (GET only → no CORS preflight) ---------- */
async function api(action, params){
  params = params || {};
  if (!CFG.api) return demoApi(action, params);
  const q = new URLSearchParams(Object.assign({action}, params)).toString();
  const res = await fetch(CFG.api + (CFG.api.includes('?') ? '&' : '?') + q, {method:'GET', redirect:'follow'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j;
}
function demoApi(action, p){
  const all = store.get('ec_demo', []);
  if (action === 'ping') return {ok:true, demo:true};
  if (action === 'save'){ const r = JSON.parse(p.payload); if (!all.find(x => x.id === r.id)) all.push(r); store.set('ec_demo', all); return {ok:true, id:r.id}; }
  if (action === 'list') return {ok:true, records: all.filter(r => (!p.from || r.date >= p.from) && (!p.to || r.date <= p.to))};
  if (action === 'delete'){ store.set('ec_demo', all.filter(r => r.id !== p.id)); return {ok:true}; }
  return {ok:false, error:'unknown action'};
}

/* ---------- offline queue ---------- */
function queue(){ return store.get('ec_queue', []); }
function renderQueue(){
  const q = queue(); $('queueBox').style.display = q.length ? 'flex' : 'none';
  $('queueTxt').textContent = q.length + ' ' + t('pending');
}
async function syncQueue(){
  const q = queue(); if (!q.length) return;
  const left = [];
  for (const r of q){ try{ await api('save', {payload: JSON.stringify(r)}); }catch(e){ left.push(r); } }
  store.set('ec_queue', left); renderQueue();
  if (!left.length) toast(t('saved'), 'ok');
}

function currentItems(){
  if (mod === 'SURF'){ const a = AREAS[$('f_area').value]; return a ? a.s.map(c => ({code:c, label:L(S[c]), tag:S[c][2]})) : []; }
  if (mod === 'OBS'){
    const base = OBS.map(r => ({code:r[0], label:L([r[1], r[2]])}));
    if ($('f_clean').value === 'TERMINAL') return base.concat([{sec:t('termSec')}], TERM.map(r => ({code:r[0], label:L([r[1], r[2]]), tag:'T'})));
    return base;
  }
  return SUP.map(r => ({code:r[0], label:L([r[1], r[2]])}));
}
function renderItems(){
  const titles = {SURF:['surfItems','surfHint'], OBS:['obsItems','obsHint'], SUP:['supItems','supHint']}[mod];
  $('itemsTitle').textContent = t(titles[0]); $('itemsHint').textContent = t(titles[1]);
  const opts = mod === 'SURF'
    ? [['C','✓',t('clean')],['P','◐',t('partial')],['N','✗',t('notclean')],['NA','N/A','']]
    : [['Y','✓',t('yes')],['N','✗',t('no')],['NA','N/A','']];
  const list = currentItems();
  if (!list.length){
    $('items').innerHTML = `<div class="pick"><p>${esc(t('pickArea'))}</p><div class="chips">${Object.entries(AREAS).map(([k, a]) =>
      `<button type="button" class="chip" data-area="${k}">${esc(L(a.n))}</button>`).join('')}</div></div>`;
    updateScore(); return;
  }
  // keep answers only for visible items
  const codes = list.filter(i => i.code).map(i => i.code);
  Object.keys(answers).forEach(k => { if (!codes.includes(k)) delete answers[k]; });
  let n = 0;
  $('items').innerHTML = list.map(it => {
    if (it.sec) return `<div class="sec-h">${esc(it.sec)}</div>`;
    n++;
    const tag = it.tag ? `<span class="tag ${it.tag}">${it.tag === 'T' ? 'Terminal' : it.tag}</span>` : '';
    return `<div class="item ${answers[it.code] ? 'done' : ''}" data-code="${it.code}"><div class="lb"><span class="no">${n}.</span> ${esc(it.label)}${tag}</div>
      <div class="opts" style="--n:${opts.length}">${opts.map(o => `<button type="button" class="opt ${o[0]} ${answers[it.code] === o[0] ? 'on' : ''}" data-v="${o[0]}">${o[1]}${o[2] ? `<small>${esc(o[2])}</small>` : ''}</button>`).join('')}</div></div>`;
  }).join('');
  updateScore();
}
function computeScore(m, items){
  let app = 0, ok = 0, partial = 0;
  for (const v of Object.values(items)){
    if (v === 'NA' || !v) continue;
    app++; if (v === 'C' || v === 'Y') ok++; if (v === 'P') partial++;
  }
  return {applicable:app, compliant:ok, partial, score: app ? Math.round(ok / app * 1000) / 10 : null};
}
function updateScore(){
  const list = currentItems().filter(i => i.code);
  const s = computeScore(mod, answers);
  const answered = list.filter(i => answers[i.code]).length;
  $('liveScore').textContent = fmt(s.score);
  $('liveScore').className = 'big ' + cls(s.score);
  $('liveMeta').textContent = `${answered}/${list.length} ${t('answered')} · ${s.compliant}/${s.applicable} ${t('applicable')}`;
}

  const need = ['f_date','f_ward','f_auditor'].concat(mod !== 'SUP' ? ['f_area','f_clean'] : []);

  if (bad){ toast(t('missing'), 'err'); return; }
  const sc = computeScore(mod, answers);
  if (!sc.applicable){ toast(t('noApplicable'), 'err'); return; }
  const rec = {
    id: 'EC' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(),
    module: mod, date: $('f_date').value, time: $('f_time').value, ward: $('f_ward').value,
    area: mod === 'SUP' ? 'CLOSET' : $('f_area').value,
    cleanType: mod === 'SUP' ? '' : $('f_clean').value,
    method: mod === 'SURF' ? $('f_method').value : (mod === 'OBS' ? 'OBS' : 'CHECK'),
    location: $('f_loc').value.trim(), auditor: $('f_auditor').value.trim(), cleaner: $('f_cleaner').value.trim(),
    items: Object.assign({}, answers), applicable: sc.applicable, compliant: sc.compliant, partial: sc.partial, score: sc.score,
    feedback: $('f_feedback').value, action: $('f_action').value.trim(), comments: $('f_comments').value.trim(),
    createdAt: new Date().toISOString()
  };
  store.set('ec_auditor', rec.auditor);
  const btn = $('submitBtn'); btn.disabled = true;
  try{ await api('save', {payload: JSON.stringify(rec)}); toast(t('saved') + ' · ' + fmt(rec.score), 'ok'); }
  catch(e){ const q = queue(); q.push(rec); store.set('ec_queue', q); renderQueue(); toast(t('queued'), 'err'); }
  btn.disabled = false; cache = {};
  resetForm(true); window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- data loading ---------- */
let cache = {};
async function loadMonth(m){
  if (cache[m]) return cache[m];
  const j = await api('list', {from: m + '-01', to: m + '-31'});
  const recs = (j.records || []).map(r => Object.assign({}, r, {items: typeof r.items === 'string' ? safeJson(r.items) : (r.items || {})}));
  recs.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  cache[m] = recs; return recs;
}
function safeJson(s){ try{ return JSON.parse(s); }catch(e){ return {}; } }

/* ---------- aggregation ---------- */
function isoWeek(ds){
  const d = new Date(ds + 'T00:00:00Z'); const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day + 3); const fy = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return d.getUTCFullYear() + '-W' + String(1 + Math.round(((d - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7)).padStart(2, '0');
}
function weeksOfMonth(m){
  const [y, mo] = m.split('-').map(Number); const out = [];
  const last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  for (let d = 1; d <= last; d++){ const w = isoWeek(`${m}-${String(d).padStart(2, '0')}`); if (!out.includes(w)) out.push(w); }
  return out;
}
function aggregate(recs, m){
  const sum = list => list.reduce((a, r) => ({app:a.app + (+r.applicable || 0), ok:a.ok + (+r.compliant || 0), partial:a.partial + (+r.partial || 0), n:a.n + 1}), {app:0, ok:0, partial:0, n:0});
  const by = {SURF:[], OBS:[], SUP:[]}; recs.forEach(r => by[r.module] && by[r.module].push(r));
  const A = {total:recs.length, mod:{}, ward:{}, clean:{}, method:{}, surf:{}, obs:{}, sup:{}, weeks:{}};
  for (const k in by) A.mod[k] = sum(by[k]);
  WARDS.forEach(w => { const rs = recs.filter(r => r.ward === w[0]); if (rs.length) A.ward[w[0]] = {SURF:sum(rs.filter(r => r.module === 'SURF')), OBS:sum(rs.filter(r => r.module === 'OBS')), SUP:sum(rs.filter(r => r.module === 'SUP'))}; });
  Object.keys(CLEANS).forEach(c => { const rs = by.SURF.filter(r => r.cleanType === c); if (rs.length) A.clean[c] = sum(rs); });
  Object.keys(CLEANS).forEach(c => { const rs = by.OBS.filter(r => r.cleanType === c); if (rs.length){ A.clean[c] = A.clean[c] || {app:0, ok:0, partial:0, n:0}; A.clean[c].obs = sum(rs); } });
  Object.keys(METHODS).forEach(c => { const rs = by.SURF.filter(r => r.method === c); if (rs.length) A.method[c] = sum(rs); });
  const tally = (list, target) => list.forEach(r => Object.entries(r.items || {}).forEach(([c, v]) => {
    const o = target[c] = target[c] || {app:0, ok:0, partial:0, bad:0, na:0};
    if (v === 'NA'){ o.na++; return; } o.app++; if (v === 'C' || v === 'Y') o.ok++; else if (v === 'P') o.partial++; else o.bad++;
  }));
  tally(by.SURF, A.surf); tally(by.OBS, A.obs); tally(by.SUP, A.sup);
  const fbRecs = recs.filter(r => r.module !== 'SUP');
  A.fb = {yes: fbRecs.filter(r => r.feedback === 'Y').length, n: fbRecs.length};
  if (m){ weeksOfMonth(m).forEach(w => A.weeks[w] = 0); by.SURF.filter(r => AREAS[r.area] && AREAS[r.area].ip).forEach(r => { const w = isoWeek(r.date); if (w in A.weeks) A.weeks[w]++; }); }
  return A;
}

function rankList(stats){ return Object.entries(stats).filter(([, o]) => o.app).map(([c, o]) => [c, o, pct(o.ok, o.app)]).sort((a, b) => a[2] - b[2]); }
function rankCard(title, stats, m, limit){
  let rows = rankList(stats); if (!rows.length) return ''; if (limit) rows = rows.slice(0, limit);
  return `<div class="card"><h3>${esc(title)}</h3><div class="tw"><table><tr><th>${esc(t(m === 'SURF' ? 'surface' : 'item'))}</th><th class="num">${esc(t('checked'))}</th><th class="num">${esc(t(m === 'SURF' ? 'pctClean' : 'pctYes'))}</th><th></th></tr>

}

  const sn = w ? ['២','៣','៤','៥','៦','៧'] : ['៤','៥','៦','៧','៨','៩'], en = w ? [2,3,4,5,6,7] : [4,5,6,7,8,9];

  const rk = (stats, m2, colKm, colEn) => { const rows = rankList(stats); if (!rows.length) return `<p style="font-size:12.5px">${BI('noData')}</p>`;

function calc(){
  const bp = +$('c_bp').value, dp = +$('c_dp').value, v = +$('c_vl').value;
  if (bp > dp && v > 0){
    const parts = bp / dp - 1, bleach = v / (parts + 1);
    $('c_out1').innerHTML = lang === 'km'
      ? `ទឹកក្លរ ១ ចំណែក + ទឹក ${parts.toFixed(1)} ចំណែក → សម្រាប់ ${v} លីត្រ៖ ទឹកក្លរ <b>${(bleach * 1000).toFixed(0)} ml</b> + ទឹក <b>${((v - bleach) * 1000).toFixed(0)} ml</b>`
      : `1 part bleach + ${parts.toFixed(1)} parts water → for ${v} L: <b>${(bleach * 1000).toFixed(0)} ml</b> bleach + <b>${((v - bleach) * 1000).toFixed(0)} ml</b> water`;
  } else $('c_out1').textContent = '–';
  const pp = +$('c_pp').value, dp2 = +$('c_dp2').value, v2 = +$('c_vl2').value;
  if (pp > 0 && v2 > 0){
    const g = dp2 / pp * 1000;
    $('c_out2').innerHTML = lang === 'km'
      ? `ម្សៅក្លរ <b>${g.toFixed(1)} ក្រាម</b> ក្នុងទឹក ១ លីត្រ → សម្រាប់ ${v2} លីត្រ៖ <b>${(g * v2).toFixed(0)} ក្រាម</b> (សូលុយស្យុងអាចមានពណ៌ស្រអាប់)`
      : `<b>${g.toFixed(1)} g</b> powder per litre → for ${v2} L: <b>${(g * v2).toFixed(0)} g</b> (solution may look cloudy)`;
  } else $('c_out2').textContent = '–';
}

  <tr><td>4–6</td><td class="fair">${km ? 'មធ្យម' : 'Moderate'}</td><td>${km ? 'យ៉ាងតិចម្ដង/ថ្ងៃ និងបន្ថែមពេលប្រឡាក់' : 'At least once daily, plus when soiled'}</td></tr>
  <tr><td>2–3</td><td class="good">${km ? 'ទាប' : 'Low'}</td><td>${km ? 'តាមកាលវិភាគ និងបន្ថែមពេលប្រឡាក់' : 'Fixed schedule, plus when soiled'}</td></tr></table></div>
  <p class="hint" style="margin-top:6px">${km ? 'ពិន្ទុ = ការចម្លងរោគ (ធ្ងន់ 3/មធ្យម 2/ស្រាល 1) + ការប៉ះ (ញឹក 3/តិច 1) + ភាពងាយរងគ្រោះ (ខ្លាំង 1/ធម្មតា 0)' : 'Score = contamination (heavy 3 / moderate 2 / light 1) + exposure (high-touch 3 / low-touch 1) + vulnerability (more 1 / less 0)'}</p>
  <h3 style="margin-top:14px">${km ? 'បង្គន់អ្នកជំងឺ' : 'Patient toilets'}</h3>
  <p class="hint">${km ? 'សម្អាត និងសម្លាប់មេរោគ យ៉ាងតិច ១ដង/ថ្ងៃ (បន្ទប់ឯកជន) និង ២ដង/ថ្ងៃ (បង្គន់សាធារណៈ/រួម)' : 'Clean and disinfect at least once daily (private) and twice daily (public / shared)'}</p>`;
}
function loadSettings(){ $('s_api').value = store.get('ec_api', '') || DEFAULT_API_URL; $('s_target').value = CFG.target; $('s_good').value = CFG.good; $('s_fair').value = CFG.fair; }

/* ---------- events ---------- */
function switchTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
  if (name === 'dash') renderDash(); if (name === 'records') renderRecords();
  window.scrollTo({top:0});
}
function renderAll(){ applyI18n(); fillAllSelects(); renderMods(); renderItems(); renderRef(); calc(); }

document.addEventListener('click', e => {
  const tb = e.target.closest('nav.tabs button'); if (tb){ switchTab(tb.dataset.tab); return; }
  const mb = e.target.closest('[data-mod-btn]'); if (mb){ mod = mb.dataset.modBtn; store.set('ec_mod', mod); answers = {}; renderMods(); renderItems(); return; }
  const ob = e.target.closest('.opt'); if (ob){ const it = ob.closest('.item'); answers[it.dataset.code] = ob.dataset.v; it.classList.remove('miss'); it.classList.add('done');
    it.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === ob)); updateScore(); return; }
  const ch = e.target.closest('.chip[data-area]'); if (ch){ $('f_area').value = ch.dataset.area; renderItems(); return; }
  const tr = e.target.closest('tr.click'); if (tr){ showRecord(shownRecs[+tr.dataset.i]); return; }
  if (e.target.id === 'modalBg') $('modalBg').style.display = 'none';
});
$('langBtn').onclick = () => { lang = lang === 'km' ? 'en' : 'km'; store.set('ec_lang', lang); renderAll();
  if ($('tab-dash').classList.contains('on')) renderDash(); if ($('tab-records').classList.contains('on')) renderRecords(); };
$('f_area').onchange = renderItems; $('f_clean').onchange = () => { if (mod === 'OBS') renderItems(); };
$('submitBtn').onclick = submitAudit; $('resetBtn').onclick = () => resetForm(false);
$('d_load').onclick = () => { cache = {}; renderDash(); }; $('d_month').onchange = renderDash; $('d_ward').onchange = renderDash;
$('r_load').onclick = () => { cache = {}; renderRecords(); }; $('r_month').onchange = renderRecords; $('r_ward').onchange = renderRecords; $('r_mod').onchange = renderRecords;
$('r_xlsx').onclick = exportExcel;
$('p_gen').onclick = () => { cache = {}; buildReport(); };
$('p_print').onclick = async () => { if (!$('reportDoc').querySelector('.rp-head')) await buildReport(); setTimeout(() => window.print(), 150); };
['c_bp','c_dp','c_vl','c_pp','c_dp2','c_vl2'].forEach(id => $(id).addEventListener('input', calc));
$('syncBtn').onclick = syncQueue;
$('s_save').onclick = () => { store.set('ec_api', $('s_api').value.trim()); store.set('ec_target', +$('s_target').value); store.set('ec_good', +$('s_good').value); store.set('ec_fair', +$('s_fair').value);
  cache = {}; applyI18n(); toast(t('settingsSaved'), 'ok'); syncQueue(); };
$('s_test').onclick = async () => { try{ const j = await api('ping'); toast(t('connOk') + (j.demo ? ' (demo)' : ''), 'ok'); }catch(e){ toast(t('connFail') + ': ' + e.message, 'err'); } };
window.addEventListener('online', syncQueue);
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- init ---------- */
(function init(){
  $('f_date').value = today(); $('f_time').value = new Date().toTimeString().slice(0, 5);
  $('f_auditor').value = store.get('ec_auditor', '');
  ['d_month','r_month','p_month'].forEach(id => $(id).value = thisMonth());
  loadSettings(); renderAll(); renderQueue(); syncQueue();
})();
</script>
</body>
</html>
